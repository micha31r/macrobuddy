<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <!-- iPhone Safari has no Fullscreen API: Add to Home Screen + this tag is the iOS fullscreen path. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MacroBuddy" />
    <meta name="theme-color" content="#403b37" />
    <meta
      name="description"
      content="Turn your phone into a customisable digital macro pad. Tap a key and your computer runs it — a keyboard shortcut, a script, anything."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Social / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MacroBuddy" />
    <meta property="og:title" content="Turn your phone into a customisable digital macro pad" />
    <meta
      property="og:description"
      content="Tap a key on your phone and your computer runs it — a shortcut, a script, anything. Over your Wi-Fi, or anywhere."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turn your phone into a customisable digital macro pad" />
    <meta
      name="twitter:description"
      content="Tap a key on your phone and your computer runs it — a shortcut, a script, anything. Over your Wi-Fi, or anywhere."
    />
    <meta name="twitter:image" content="/og.png" />
    <title>MacroBuddy</title>
    <!-- Apply the saved theme + initial view before first paint to avoid a flash. -->
    <script>
      document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
      // A key in the hash → the app (full-bleed); no key → the home page.
      document.documentElement.dataset.view = location.hash.length > 1 ? 'app' : 'home';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
